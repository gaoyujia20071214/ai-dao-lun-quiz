<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工智能导论（第2版）习题练习系统</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --text:#1f2430; --muted:#6b7280;
  --accent:#2563eb; --accent2:#1d4ed8; --line:#e5e9f2;
  --ok:#16a34a; --okbg:#e8f7ee; --bad:#dc2626; --badbg:#fdecec;
  --chip:#eef2ff; --shadow:0 2px 10px rgba(30,50,90,.08);
}
[data-theme="dark"]{
  --bg:#0f1420; --card:#1a2130; --text:#e8ecf4; --muted:#98a2b3;
  --accent:#5b8cff; --accent2:#7ba4ff; --line:#2a3348;
  --ok:#34d399; --okbg:#10322a; --bad:#f87171; --badbg:#3a1520;
  --chip:#232c40; --shadow:0 2px 10px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei','微软雅黑',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;flex-direction:column;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
header .brand{font-weight:700;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{font-size:18px;padding:6px 10px;border-radius:8px;background:var(--chip)}
main{flex:1;width:100%;max-width:860px;margin:0 auto;padding:18px 14px 40px}
section.view{display:none}
section.view.active{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
footer{color:var(--muted);font-size:12px;text-align:center;padding:12px 16px 20px;border-top:1px solid var(--line)}
.hero{text-align:center;padding:26px 8px 10px}
.hero h1{font-size:24px;margin-bottom:6px}
.hero p{color:var(--muted);font-size:13px}
.notebox{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;color:var(--muted);margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);text-align:left;display:block;width:100%;transition:transform .12s,border-color .12s;color:var(--text)}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card .ic{font-size:26px}
.card .tt{font-weight:700;font-size:16px;margin-top:6px}
.card .ds{color:var(--muted);font-size:12.5px;margin-top:2px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:14px;transition:.12s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.topbar .qt{font-weight:700;font-size:15px;flex:1;min-width:120px}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.qmeta{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.tag{background:var(--chip);border-radius:8px;padding:2px 10px;font-size:12.5px;color:var(--accent);font-weight:600}
.stem{font-size:16px;font-weight:600;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card);font-size:15px;transition:.12s;color:var(--text)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .L{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .L{background:var(--bad);color:#fff}
.opt.picked{border-color:var(--accent);background:var(--chip)}
.feedback{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:14px}
.feedback.ok{background:var(--okbg);border:1px solid var(--ok)}
.feedback.no{background:var(--badbg);border:1px solid var(--bad)}
.feedback .fx-title{font-weight:700;margin-bottom:4px}
.feedback .analysis{color:var(--text);font-size:13.5px;margin-top:6px}
.navrow{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.navrow .spacer{flex:1}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;background:var(--chip);border-radius:8px;padding:4px 12px}
.timer.warn{color:var(--bad)}
.sheet{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:12px}
.sheet button{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;font-size:12px;background:var(--card);color:var(--text)}
.sheet button.done{background:var(--accent);border-color:var(--accent);color:#fff}
.result{text-align:center;padding:14px 0}
.score{font-size:52px;font-weight:800;color:var(--accent)}
.score small{font-size:16px;color:var(--muted);font-weight:500}
.result .line{color:var(--muted);font-size:14px;margin-top:4px}
.result .chips{margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.result .chips span{background:var(--chip);border-radius:8px;padding:4px 12px;font-size:13px}
.accbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 2px}
.accbar i{display:block;height:100%;background:var(--ok)}
table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:13px}
.browseitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.browseitem .bq{font-weight:600;font-size:15px}
.answerbox{display:none;margin-top:10px;border-left:3px solid var(--accent);padding:8px 12px;background:var(--chip);border-radius:0 10px 10px 0;font-size:14px;white-space:pre-wrap}
.answerbox.show{display:block;animation:fadein .2s ease}
.chaptabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}
.chaptabs button{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-size:14px}
.chaptabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chapblock{display:none}
.chapblock.on{display:block;animation:fadein .2s ease}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.fillinput{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;background:var(--card);color:var(--text);font-size:15px;transition:.12s}
.fillinput:focus{outline:none;border-color:var(--accent)}
.judgebtns{display:flex;gap:10px;margin-bottom:12px}
.judgebtn{flex:1;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;background:var(--card);transition:.12s;font-weight:600}
.judgebtn:hover:not(:disabled){border-color:var(--accent)}
.judgebtn:disabled{cursor:default}
.judgebtn.correct{border-color:var(--ok);background:var(--okbg)}
.judgebtn.picked{border-color:var(--accent);background:var(--chip)}
.judgebtn.wrong{border-color:var(--bad);background:var(--badbg)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-top:14px}
.panel h3{font-size:15px;margin-bottom:8px}
.vsub{color:var(--muted);font-size:12.5px;margin:6px 0 4px}
.vrow{display:flex;align-items:center;gap:10px;margin:6px 0}
.vlab{width:64px;flex:none;font-size:13px;color:var(--muted)}
.vbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.vbar i{display:block;height:100%;background:var(--accent)}
.vnum{width:34px;flex:none;text-align:right;font-size:13px;font-weight:700}
.toolbar{margin-top:14px}
.wronglist{margin-top:14px}
.wrongitem{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.wcheck{flex:none;display:flex;align-items:flex-start;padding-top:3px}
.wcheck input{width:17px;height:17px;cursor:pointer;accent-color:var(--accent)}
.winfo{flex:1;min-width:0}
.wmeta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag.bad{color:var(--bad);background:var(--badbg)}
.tag.good{color:var(--ok);background:var(--okbg)}
.wstem{font-size:14.5px;font-weight:600;margin-bottom:4px}
.wans{color:var(--muted);font-size:13px;margin-bottom:8px}
.wrow{display:flex;gap:8px;flex-wrap:wrap}
.btn.sm{padding:5px 11px;font-size:13px}
@media (max-width:520px){
  .hero h1{font-size:20px}
  .grid{grid-template-columns:1fr 1fr}
  .card{padding:12px}
  .sheet{grid-template-columns:repeat(8,1fr)}
  header .brand{font-size:14px}
}
</style>
</head>

const allObj = Object.keys(DATA.chapters).flatMap(ch =>
  OBJ_TYPES.flatMap(t => DATA.chapters[ch][t].map(q => ({ ch, type:t, q }))));
const qId = x => x.type + '-' + x.ch + '-' + x.q.num;

const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };

const LS = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- 统计与错题 ---------- */
const freshStats = () => ({ all:{a:0,c:0}, ch:{}, type:{choice:{a:0,c:0},fill:{a:0,c:0},judge:{a:0,c:0}} });
const getStats = () => LS.get('aigk3_stats', freshStats());
const saveStats = s => LS.set('aigk3_stats', s);
const getWrong = () => {
  const data = LS.get('aigk3_wrong', {});
  if(Array.isArray(data)){
    const obj = {}, now = Date.now();
    data.forEach(id => { const p = String(id).split('-'); if(p.length >= 3) obj[id] = { ch:p[1], type:p[0], num:p[2], count:1, first:now, last:now }; });
    saveWrong(obj);
    return obj;
  }
  return (data && typeof data === 'object') ? data : {};
};
const saveWrong = w => LS.set('aigk3_wrong', w);

function recordAnswer(ch, type, ok){
  const s = getStats();
  s.all.a += 1; if(ok) s.all.c += 1;
  s.ch[ch] = s.ch[ch] || {a:0,c:0};
  s.ch[ch].a += 1; if(ok) s.ch[ch].c += 1;
  s.type[type] = s.type[type] || {a:0,c:0};
  s.type[type].a += 1; if(ok) s.type[type].c += 1;
  saveStats(s);
}
const MASTER_STREAK = 2;
function addWrong(x){
  const id = qId(x);
  const w = getWrong();
  const now = Date.now();
  if(w[id]){ w[id].count = (w[id].count || 1) + 1; w[id].last = now; w[id].streak = 0; w[id].mastered = false; }
  else { w[id] = { ch:x.ch, type:x.type, num:x.q.num, count:1, first:now, last:now, streak:0, mastered:false }; }
  saveWrong(w);
}
function noteCorrect(x){
  const id = qId(x);
  const w = getWrong();
  const e = w[id];
  if(!e) return;
  e.streak = (e.streak || 0) + 1;
  if(e.streak >= MASTER_STREAK) e.mastered = true;
  saveWrong(w);
}
function removeWrong(id){ const w = getWrong(); delete w[id]; saveWrong(w); }

  $$('#view-home .card[data-st]').forEach(b => b.addEventListener('click', () => {

function startSprint(queue, title){
  clearTimeout(state.autoTimer);
  clearInterval(state.timerId);
  Object.assign(state, { mode:'sprint', qtype:'mixed', title, queue, idx:0, answered:{}, wrongMode:false,
    exam:false, selected:{}, selfScores:{}, review:false, examDone:false, continuous:false,
    examResult:null, sprint:true, sprintSelf:{} });
  renderQuiz();
  show('view-quiz');
}

function finishSprint(){
  clearTimeout(state.autoTimer);
  let objTotal = 0, objDone = 0, objOk = 0, subjTotal = 0, subjSelf = 0, needCheck = 0;
  state.queue.forEach((x, k) => {
    if(x.type === 'subjective'){
      subjTotal += (x.pts || x.q.pts || 10);
      subjSelf += (state.sprintSelf[k] || 0);
      if(x.q.needCheck) needCheck += 1;
    } else {
      objTotal += 1;
      if(state.answered[k] !== undefined){
        objDone += 1;
        if(correctOf(x, state.answered[k])) objOk += 1;
      }
    }
  });
  const subjLine = subjTotal ? `\n简答自评：${subjSelf} / ${subjTotal} 分${needCheck ? `（其中 ${needCheck} 题需核对课件）` : ''}` : '';
  alert(`「85%冲刺」本轮完成！\n客观题：答对 ${objOk} / ${objTotal} 题（已作答 ${objDone} 题）${subjLine}\n模块独立：不写入章节统计与错题本，可随时重刷。`);
  renderSprintPicker();
}

function startWrong(){
  const wrong = getWrong();
  const ids = Object.keys(wrong).filter(id => !wrong[id].mastered);
  if(!ids.length){ alert('错题本为空，先去刷题吧！'); return; }
  const queue = ids.map(id => {
    const e = wrong[id], [t, c, n] = id.split('-');
    const q = DATA.chapters[c] && DATA.chapters[c][t] ? DATA.chapters[c][t].find(x => x.num===n) : null;
    return q ? { ch:c, type:t, q } : null;
  }).filter(Boolean);
  shuffle(queue);
  if(!queue.length){ alert('错题本里的题目已不存在。'); return; }
  startQuiz('wrong', 'mixed', `错题重做（${queue.length} 题）`, queue);
}

function redoOne(id){
  const w = getWrong();
  const e = w[id];
  if(!e){ renderWrongBook(); return; }
  const q = DATA.chapters[e.ch] && DATA.chapters[e.ch][e.type] ? DATA.chapters[e.ch][e.type].find(x => x.num===e.num) : null;
  if(!q){ alert('这道题已不存在，可能已被清理。'); return; }
  startQuiz('wrong', e.type, `错题重做 · ${TYPES[e.type]}`, [{ ch:e.ch, type:e.type, q }]);
}

function renderWrongBook(){
  show('view-wrong');
  const w = getWrong();
  const ids = Object.keys(w);
  if(!ids.length){
    $('#view-wrong').innerHTML = `
      <div class="hero"><h1>错题本</h1><p>集中查看、重做、清理做错的题目</p></div>
      <div class="empty">错题本为空，先去刷几道题吧 📭</div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="backHomeW">返回首页</button></div>`;
    $('#backHomeW').addEventListener('click', renderHome);
    return;
  }

  const typeCount = {choice:0, fill:0, judge:0};
  const chCount = {};
  let totalWrong = 0, freqSum = 0;
  ids.forEach(id => {
    const e = w[id];
    const cnt = e.count || 1;
    typeCount[e.type] = (typeCount[e.type] || 0) + 1;
    chCount[e.ch] = (chCount[e.ch] || 0) + 1;
    totalWrong += 1;
    freqSum += cnt;
  });
  const masteredCount = ids.filter(id => w[id].mastered).length;
  const maxType = Math.max(1, ...Object.values(typeCount));
  const typeBars = OBJ_TYPES.map(t => {
    const n = typeCount[t] || 0;
    return `<div class="vrow"><span class="vlab">${TYPES[t]}</span>
      <div class="vbar"><i style="width:${Math.round(n/maxType*100)}%"></i></div>
      <span class="vnum">${n}</span></div>`;
  }).join('');
  const chBars = Object.keys(chCount).sort((a,b) => chCount[b]-chCount[a]).map(ch => {
    const n = chCount[ch];
    return `<div class="vrow"><span class="vlab">第${ch}章</span>
      <div class="vbar"><i style="width:${Math.round(n/maxType*100)}%"></i></div>
      <span class="vnum">${n}</span></div>`;
  }).join('');

  const sorted = [...ids].sort((a,b) => {
    const ma = w[a].mastered ? 1 : 0, mb = w[b].mastered ? 1 : 0;
    if(ma !== mb) return ma - mb;
    return (w[b].count || 1) - (w[a].count || 1);
  });
  const items = sorted.map(id => {
    const e = w[id];
    const q = DATA.chapters[e.ch] && DATA.chapters[e.ch][e.type] ? DATA.chapters[e.ch][e.type].find(x => x.num===e.num) : null;
    if(!q) return '';
    const ansTxt = e.type==='choice' ? q.answer : e.type==='fill' ? q.answer : (q.answer ? '正确' : '错误');
    return `<div class="wrongitem">
      <label class="wcheck"><input type="checkbox" data-cb="${id}"></label>
      <div class="winfo">
        <div class="wmeta"><span class="tag">${TYPES[e.type]}</span><span class="tag">第${e.ch}章</span>${e.mastered ? '<span class="tag good">✅ 已掌握</span>' : `<span class="tag bad">错 ${e.count || 1} 次</span>`}${(!e.mastered && (e.streak || 0) > 0) ? `<span class="tag">连续对 ${e.streak} 次</span>` : ''}</div>
        <div class="wstem">${esc(q.stem)}</div>
        <div class="wans">正确答案：${esc(ansTxt)}</div>
        <div class="wrow">
          <button class="btn sm" data-redo="${id}">🔁 重做</button>
          <button class="btn sm danger" data-del="${id}">🗑 删除</button>
        </div>
      </div>
    </div>`;
  }).join('');

  $('#view-wrong').innerHTML = `
    <div class="hero"><h1>错题本</h1>
      <p>共 ${totalWrong} 道错题 · 未掌握 ${totalWrong - masteredCount} · 已掌握 ${masteredCount} · 累计错 ${freqSum} 次</p>
    </div>
    <div class="panel">
      <h3>📊 错题类型与章节分布</h3>
      <div class="vsub">按题型（错题数）</div>${typeBars}
      <div class="vsub" style="margin-top:12px">按章节（错题数）</div>${chBars}
    </div>
    <div class="row toolbar">
      <button class="btn primary" id="redoAll">🔁 重做全部（${totalWrong - masteredCount}）</button>
      <button class="btn" id="selAll">全选</button>
      <button class="btn" id="clearMastered">清除已掌握（${masteredCount}）</button>
      <button class="btn danger" id="delSel">🗑 删除所选</button>
    </div>
    <div class="wronglist">${items}</div>`;

  const sel = new Set();
  $('#redoAll').addEventListener('click', startWrong);
  $('#selAll').addEventListener('click', () => {
    const all = ids;
    const check = sel.size !== all.length;
    $$('#view-wrong [data-cb]').forEach(cb => { cb.checked = check; if(check) sel.add(cb.dataset.cb); else sel.delete(cb.dataset.cb); });
    $('#selAll').textContent = check ? '取消全选' : '全选';
  });
  $('#clearMastered').addEventListener('click', () => {
    const m = ids.filter(id => w[id].mastered);
    if(!m.length){ alert('还没有已掌握的错题'); return; }
    if(!confirm(`清除 ${m.length} 道已掌握的错题？`)) return;
    const ww = getWrong(); m.forEach(id => delete ww[id]); saveWrong(ww);
    renderWrongBook();
  });
  $$('#view-wrong [data-cb]').forEach(cb => cb.addEventListener('change', () => {
    if(cb.checked) sel.add(cb.dataset.cb); else sel.delete(cb.dataset.cb);
  }));
  $('#delSel').addEventListener('click', () => {
    const list = [...sel];
    if(!list.length){ alert('请先勾选要删除的错题'); return; }
    if(!confirm(`确定删除选中的 ${list.length} 道错题吗？`)) return;
    const ww = getWrong(); list.forEach(id => delete ww[id]); saveWrong(ww);
    renderWrongBook();
  });
  $$('#view-wrong [data-del]').forEach(b => b.addEventListener('click', () => {
    if(!confirm('确定删除这道错题吗？')) return;
    removeWrong(b.dataset.del);
    renderWrongBook();
  }));
  $$('#view-wrong [data-redo]').forEach(b => b.addEventListener('click', () => redoOne(b.dataset.redo)));
}

/* ---------- 第二场 · B卷：组卷 ---------- */
function samplePool(type){
  const pool = [];
  Object.keys(DATA.chapters).forEach(ch =>
    DATA.chapters[ch][type].forEach(q => pool.push({ ch, type, q })));
  return shuffle(pool);
}
function buildExamQueue(){
  const queue = [];
  EXAM.blocks.forEach(b => {
    const picked = samplePool(b.type).slice(0, Math.min(b.n, samplePool(b.type).length));
    picked.forEach((x, idx) => {
      const pts = Array.isArray(b.pts) ? (b.pts[idx] !== undefined ? b.pts[idx] : 0) : b.pts;
      queue.push({ ch:x.ch, type:x.type, q:x.q, pts });
    });
  });
  return queue;
}
function examMaxScore(){
  return EXAM.blocks.reduce((s,b) => s + (Array.isArray(b.pts) ? b.pts.reduce((a,c)=>a+c,0) : b.pts*b.n), 0);
}

function startExam(){
  const queue = buildExamQueue();
  Object.assign(state, { mode:'exam', qtype:'mixed', title:EXAM.title, queue, idx:0,
    answered:{}, wrongMode:false, exam:true, selected:{}, selfScores:{}, review:false,
    examDone:false, startTs: Date.now(), continuous:false, examResult:null, sprint:false, sprintSelf:{} });
  state.timeLeft = EXAM.minutes * 60;
  clearInterval(state.timerId);
  state.timerId = setInterval(tick, 1000);
  renderQuiz();
  show('view-quiz');
}

function tick(){
  state.timeLeft -= 1;
  const t = $('#timer');
  if(t) t.textContent = fmtTime(state.timeLeft);
  if(state.timeLeft <= 0){ clearInterval(state.timerId); submitExam(true); }
}
const fmtTime = s => `${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;

function cur(){ return state.queue[state.idx]; }
function hasAns(k){ const v = state.selected[k]; return v !== undefined && String(v).trim() !== ''; }
function correctOf(x, val){
  if(x.type === 'choice') return val === x.q.answer;
  if(x.type === 'fill') return String(val||'').replace(/\s+/g,'') === String(x.q.answer||'').replace(/\s+/g,'');
  if(x.type === 'judge') return val === x.q.answer;
  return false;
}
function typePos(k){
  const t = state.queue[k].type;
  let before = 0, total = 0;
  state.queue.forEach((x,i) => { if(x.type === t){ total++; if(i < k) before++; } });
  return { pos: before + 1, total };
}
function updateSheet(){
  if(!state.exam) return;
  $$('#view-quiz .sheet button').forEach((b, k) => {
    if(hasAns(k)) b.classList.add('done'); else b.classList.remove('done');
  });
}

function renderQuiz(){
  clearTimeout(state.autoTimer);
  const x = cur();
  if(!x){
    if(state.exam) return submitExam(false);
    if(state.sprint){ finishSprint(); return; }
    finishPractice();
    return;
  }
  const i = state.idx, total = state.queue.length;
  const chTitle = state.sprint ? '85%冲刺' : DATA.chapters[x.ch].title;
  const chTag = state.sprint ? '85%冲刺 · 独立题库' : `第${x.ch}章 · ${esc(chTitle)}`;
  const typeLabel = state.exam ? EXAM_LABEL[x.type]
    : (state.sprint ? (x.type === 'subjective' ? '简答题' : TYPES[x.type]) : TYPES[x.type]);
  const inExam = state.exam && !state.examDone;
  const pos = state.exam ? typePos(i) : null;

  let body = '', feedback = '';

  if(x.type === 'choice'){
    const opts = x.q.options.map((o, oi) => {

    }).join('');
    body = `<div class="opts">${opts}</div>`;
  } else if(x.type === 'fill'){
    const val = state.exam ? state.selected[i] || '' : state.answered[i] || '';
    body = `<input class="fillinput" id="fillInput" placeholder="请输入答案（填写关键词或完整表述均可）" value="${esc(val)}" ${state.exam ? '' : (state.answered[i] !== undefined ? 'disabled' : '')}>`;
  } else if(x.type === 'judge'){
    const dis = state.exam ? '' : (state.answered[i] !== undefined ? 'disabled' : '');
    body = `<div class="judgebtns">
      <button class="judgebtn ${judgeCls(i,true)}" data-i="${i}" data-v="1" ${dis}>✅ 正确</button>

  $('#prevBtn').addEventListener('click', () => { if(state.idx>0){ state.idx--; renderQuiz(); } });
  $('#nextBtn').addEventListener('click', () => {
    if(state.idx < state.queue.length-1){ state.idx++; renderQuiz(); }
    else {
      if(state.examDone){ show('view-result'); renderResult(); }
      else if(state.exam){ submitExam(false); }
      else if(state.sprint){ finishSprint(); }
      else finishPractice();
    }
  });

  if(x.type === 'choice'){
    $$('#view-quiz .opt').forEach(b => b.addEventListener('click', () => {
      answer(+b.dataset.i, b.dataset.l);
    }));
  } else if(x.type === 'judge'){
    $$('#view-quiz .judgebtn').forEach(b => b.addEventListener('click', () => {
      answer(+b.dataset.i, b.dataset.v === '1');
    }));
  } else if(x.type === 'fill'){
    const inp = $('#fillInput');
    if(inp && !inp.disabled){
      inp.addEventListener('input', () => { if(state.exam){ state.selected[state.idx] = inp.value; updateSheet(); } });
      if(!state.exam){
        const submitFill = () => { if(state.answered[state.idx] === undefined) answer(state.idx, inp.value); };
        inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); submitFill(); } });
        inp.addEventListener('blur', submitFill);
      }
    }
  } else if(x.type === 'subjective'){
    const ta = $('#subjInput');
    if(ta && !ta.disabled){
      ta.addEventListener('input', () => { state.selected[state.idx] = ta.value; updateSheet(); });
    }
    if(state.sprint){
      const submit = () => {
        const box = $('#subjInput');
        state.answered[state.idx] = box ? box.value : '';
        state.selected[state.idx] = state.answered[state.idx];
        renderQuiz();
      };
      const sb = $('#subjSubmit');
      if(sb) sb.addEventListener('click', submit);
      const sk = $('#subjSkip');
      if(sk) sk.addEventListener('click', () => {
        state.answered[state.idx] = '';
        state.selected[state.idx] = '';
        renderQuiz();
      });
      $$('#view-quiz [data-self]').forEach(b => b.addEventListener('click', () => {
        state.sprintSelf[+b.dataset.self] = +b.dataset.v;
        renderQuiz();
      }));
    }
  }
}

function answer(k, val){
  const x = state.queue[k];
  if(state.exam){ state.selected[k] = val; renderQuiz(); return; }
  if(state.answered[k] !== undefined) return;
  state.answered[k] = val;
  const ok = correctOf(x, val);
  if(!state.sprint){
    recordAnswer(x.ch, x.type, ok);
    if(!ok) addWrong(x);
    else noteCorrect(x);
  }
  renderQuiz();
  if(state.continuous){
    clearTimeout(state.autoTimer);
    if(state.idx < state.queue.length - 1){
      state.autoTimer = setTimeout(() => { state.idx++; renderQuiz(); }, 1200);
    } else {
      state.autoTimer = setTimeout(() => { finishPractice(); }, 1200);
    }
  }
}

function optCls(i, letter){
  if(state.exam && state.examDone){
    const x = state.queue[i].q;
    if(letter === x.answer) return 'correct';
    if(letter === state.selected[i]) return 'wrong';
    return '';
  }
  if(state.exam){
    return state.selected[i] === letter ? 'picked' : '';
  }
  if(state.answered[i] !== undefined){
    const x = state.queue[i].q;
    if(letter === x.answer) return 'correct';
    if(letter === state.answered[i]) return 'wrong';
  }
  return '';
}

function judgeCls(i, val){
  const x = state.queue[i].q;
  if(state.exam && state.examDone){
    if(val === x.answer) return 'correct';
    if(state.selected[i] === val) return 'wrong';
    return '';
  }
  if(state.exam){
    return state.selected[i] === val ? 'picked' : '';
  }
  if(state.answered[i] !== undefined){
    if(val === x.answer) return 'correct';
    if(state.answered[i] === val) return 'wrong';
  }
  return '';
}

function finishPractice(){
  clearTimeout(state.autoTimer);
  const c = state.queue.filter((_, k) => correctOf(state.queue[k], state.answered[k])).length;
  const t = state.queue.length;
  alert(`本轮完成！答对 ${c} / ${t} 题（正确率 ${t?Math.round(c/t*100):0}%）。\n答错的题已收入错题本。`);
  renderHome();
}

/* ---------- 考试交卷与成绩 ---------- */
function submitExam(auto){
  clearInterval(state.timerId);
  if(state.examDone) return;
  state.examDone = true;
  const blocks = {};
  EXAM.blocks.forEach(b => { blocks[b.type] = { n:0, c:0, max:0, got:0 }; });
  let correct = 0, objCount = 0;
  state.queue.forEach((x, k) => {
    const b = blocks[x.type];
    b.n += 1; b.max += x.pts;
    if(x.type === 'subjective') return;
    objCount += 1;
    const ok = correctOf(x, state.selected[k]);
    if(ok){ correct += 1; b.c += 1; b.got += x.pts; }
    recordAnswer(x.ch, x.type, ok);
    if(!ok) addWrong(x);
  });
  const objectiveScore = OBJ_TYPES.reduce((s,t) => s + blocks[t].got, 0);
  const objMax = OBJ_TYPES.reduce((s,t) => s + blocks[t].max, 0);
  state.examResult = { blocks, correct, objCount, objMax, objectiveScore,
    used: Math.round((Date.now()-state.startTs)/1000), auto };
  state.selfScores = {};
  state.idx = 0;
  renderResult();
  show('view-result');
}

function subjSlots(){
  return state.queue.map((x, k) => ({ x, k })).filter(o => o.x.type === 'subjective');
}
function selfScored(){
  const slots = subjSlots();
  return slots.length > 0 && slots.every(o => state.selfScores[o.k] !== undefined && state.selfScores[o.k] !== null);
}
function selfScoreSum(){
  return subjSlots().reduce((s, o) => s + (state.selfScores[o.k] || 0), 0);
}

function renderResult(){
  const r = state.examResult;
  if(!r){ renderHome(); return; }
  const slots = subjSlots();
  const subjMax = slots.reduce((s, o) => s + o.x.pts, 0);
  const done = selfScored();
  const subGot = done ? selfScoreSum() : 0;
  const total = Math.round(r.objectiveScore + subGot);
  const grade = total>=90?'优秀':total>=80?'良好':total>=60?'及格':'还需努力';
  const objAcc = r.objCount ? Math.round(r.correct/r.objCount*100) : 0;
  const totalMax = examMaxScore();

  const rows = EXAM.blocks.map(b => {
    const m = r.blocks[b.type];
    const isSubj = b.type === 'subjective';
    const got = isSubj ? (done ? subGot : null) : m.got;
    const acc = isSubj ? '—' : (m.n ? Math.round(m.c/m.n*100)+'%' : '—');
    return `<tr><td>${EXAM_LABEL[b.type]}</td><td>${m.n} 题 × ${isSubj ? slots.map(o=>o.x.pts).join('/') : b.pts} 分</td>
      <td>${got===null ? '<span style="color:var(--muted)">待自评</span>' : got + ' / ' + m.max}</td>
      <td>${acc}</td></tr>`;
  }).join('');

  const subjPanel = (slots.length && !done) ? `
    <div class="panel">
      <h3>✍️ 简答题自评（共 ${subjMax} 分，按 ${slots.map(o=>o.x.pts).join(' / ')} 计）</h3>
      <div class="vsub">先展开参考答案，对照自己的作答按采分点给分；三题都填好后提交，即可得到总分。</div>
      ${slots.map((o, n) => {
        const mine = state.selected[o.k];
        return `<div class="browseitem">
          <div class="bq">${n+1}. ${esc(o.x.q.q)}　<span class="tag">${o.x.pts} 分</span></div>
          <div class="wans">我的作答：${mine && String(mine).trim() ? nl(mine) : '（未作答）'}</div>
          <button class="btn" data-sub-toggle="${o.k}" style="margin-top:8px">👀 展开参考答案</button>
          <div class="answerbox" id="subans-${o.k}">${nl(o.x.q.a)}</div>
          <div class="row" style="align-items:center;margin-top:10px">
            <span class="vlab">自评得分</span>
            <input class="fillinput" id="self-${o.k}" type="number" min="0" max="${o.x.pts}" step="1" style="max-width:110px" placeholder="0-${o.x.pts}">
            <span class="tag">/ ${o.x.pts} 分</span>
          </div>
        </div>`;
      }).join('')}
      <div class="row"><button class="btn primary" id="submitSelf">✅ 提交自评得分</button></div>
    </div>` : '';

  $('#view-result').innerHTML = `
    <div class="result">
      <div class="hero"><h1>${EXAM.title} · 成绩单</h1></div>
      <div class="score">${done ? total : r.objectiveScore}<small> / ${totalMax} 分 · ${done ? grade : '客观题得分'}</small></div>
      <div class="line">客观题 ${r.objectiveScore} / ${r.objMax} 分 · 正确率 ${objAcc}%${done ? `　简答自评 ${subGot} / ${subjMax} 分` : '　简答待自评'}</div>
      <div class="line">总分 ${done ? total + ' / ' + totalMax + ' 分 · ' + grade : '待自评后计算'} · 用时 ${fmtTime(r.used)}</div>
      ${r.auto ? '<div class="line" style="color:var(--bad)">⏰ 时间到，系统已自动交卷</div>' : ''}
      <table>
        <tr><th>题型</th><th>题量与分值</th><th>得分</th><th>正确率</th></tr>
        ${rows}
      </table>
    </div>
    ${subjPanel}
    <div class="row" style="justify-content:center;margin-top:18px">
      <button class="btn primary" id="reviewBtn">逐题回顾解析</button>
      <button class="btn" id="resultHome">返回首页</button>
    </div>`;

  $$('#view-result [data-sub-toggle]').forEach(b => b.addEventListener('click', () => {
    const box = $('#subans-' + b.dataset.subToggle);
    if(!box) return;
    const on = !box.classList.contains('show');
    box.classList.toggle('show', on);
    b.textContent = on ? '🙈 收起参考答案' : '👀 展开参考答案';
  }));
  const selfBtn = $('#submitSelf');
  if(selfBtn) selfBtn.addEventListener('click', () => {
    const bad = [];
    slots.forEach(o => {
      const inp = $('#self-' + o.k);
      const raw = inp ? inp.value.trim() : '';
      const v = +raw;
      if(raw === '' || isNaN(v) || v < 0 || v > o.x.pts) bad.push(o);
      else state.selfScores[o.k] = Math.round(v);
    });
    if(bad.length){
      alert(`请为全部 ${slots.length} 道简答题填写 0 到对应分值之间的整数得分。`);
      return;
    }
    renderResult();
  });

  $('#reviewBtn').addEventListener('click', () => {
    state.idx = 0;
    renderQuiz();
    show('view-quiz');
  });
  $('#resultHome').addEventListener('click', renderHome);
}

/* ---------- 思考题浏览 ---------- */
function renderBrowse(){
  show('view-browse');
  const chs = Object.keys(DATA.chapters).filter(ch => DATA.chapters[ch].subjective.length);
  $('#view-browse').innerHTML = `
    <div class="hero"><h1>思考题浏览</h1><p>先自己尝试作答，再点开参考答案对照</p></div>
    <div class="chaptabs">${chs.map((ch,i) => `<button data-t="${ch}" class="${i===0?'on':''}">第${ch}章</button>`).join('')}</div>
    ${chs.map((ch,i) => {
      const subj = DATA.chapters[ch].subjective;
      return `<div class="chapblock ${i===0?'on':''}" id="chb-${ch}">
        <h3 style="margin-bottom:4px">第${ch}章 · ${esc(DATA.chapters[ch].title)}（${subj.length} 题）</h3>
        ${subj.map(q => `
          <div class="browseitem">
            <div class="bq">${esc(q.num)}. ${nl(q.q)}</div>
            <button class="btn" data-toggle="${ch}-${q.num}" style="margin-top:8px">👀 查看参考答案</button>
            <div class="answerbox" id="ans-${ch}-${q.num}">${nl(q.a)}</div>
          </div>`).join('')}
      </div>`;
    }).join('')}`;
  $$('#view-browse .chaptabs button').forEach(b => b.addEventListener('click', () => {
    $$('#view-browse .chaptabs button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    $$('#view-browse .chapblock').forEach(x => x.classList.remove('on'));
    $('#chb-'+b.dataset.t).classList.add('on');
  }));
  $$('#view-browse [data-toggle]').forEach(b => b.addEventListener('click', () => {
    const box = $('#ans-'+b.dataset.toggle);
    const showIt = !box.classList.contains('show');
    box.classList.toggle('show', showIt);
    b.textContent = showIt ? '🙈 收起参考答案' : '👀 查看参考答案';
  }));
}

/* ---------- 统计 ---------- */
function renderStats(){
  show('view-stats');
  const st = getStats();
  const wrong = getWrong();
  const wrongCount = Object.keys(wrong).length;
  const rows = Object.keys(DATA.chapters).filter(ch => st.ch[ch]).map(ch => {
    const m = st.ch[ch];
    return `<tr><td>第${ch}章 · ${esc(DATA.chapters[ch].title)}</td>
      <td>${m.a}</td><td>${m.c}</td>
      <td>${m.a ? Math.round(m.c/m.a*100)+'%' : '—'}</td></tr>`;
  }).join('');
  const trows = OBJ_TYPES.map(t => {
    const m = st.type[t] || {a:0,c:0};
    return `<tr><td>${TYPES[t]}</td><td>${m.a}</td><td>${m.c}</td><td>${m.a ? Math.round(m.c/m.a*100)+'%' : '—'}</td></tr>`;
  }).join('');
  $('#view-stats').innerHTML = `
    <div class="hero"><h1>学习统计</h1>
      <p>共答题 ${st.all.a} 题 · 答对 ${st.all.c} 题 · 正确率 ${st.all.a ? Math.round(st.all.c/st.all.a*100)+'%' : '—'} · 错题本 ${wrongCount} 题</p>
    </div>
    <table>
      <tr><th>章节</th><th>做题数</th><th>答对数</th><th>正确率</th></tr>
      ${rows || '<tr><td colspan="4" style="color:var(--muted)">暂无答题记录，先去刷几道题吧</td></tr>'}
    </table>
    <table>
      <tr><th>题型</th><th>做题数</th><th>答对数</th><th>正确率</th></tr>
      ${trows}
    </table>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" id="redoWrong">📕 错题本（${wrongCount}）</button>
      <button class="btn danger" id="clearWrong">清空错题本</button>
      <button class="btn danger" id="clearStats">清空答题记录</button>
    </div>`;
  $('#redoWrong').addEventListener('click', renderWrongBook);
  $('#clearWrong').addEventListener('click', () => { if(confirm('确定清空错题本吗？')){ saveWrong({}); renderStats(); } });
  $('#clearStats').addEventListener('click', () => { if(confirm('确定清空全部答题记录吗？')){ saveStats(freshStats()); renderStats(); } });
}

renderHome();

</script>
